name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: FEG_prism

      - name: Build
        run: cargo build --release --manifest-path FEG_prism/Cargo.toml

      - name: Test
        run: cargo test --release --manifest-path FEG_prism/Cargo.toml

      - name: Clippy
        if: runner.os == 'Linux'
        run: >
          cargo clippy --manifest-path FEG_prism/Cargo.toml -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::needless_range_loop
          -A clippy::manual_range_contains
          -A clippy::manual_is_multiple_of
          -A clippy::redundant_closure
          -A clippy::collapsible_else_if
          -A clippy::unnecessary_cast
          -A clippy::new_without_default
          -A clippy::useless_vec
