[package]
name = "causal_set_sim"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.33"
sprs = "0.11"
rand = "0.8"
rayon = "1.10"
sysinfo = "0.33"
smallvec = "1.15.1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
