[project]
name = "causal-anim"
version = "0.1.0"
description = "Programmatic animation engine for quantum gravity on graphs"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "causal_anim_core/Cargo.toml"
python-source = "."
module-name = "causal_anim_core"
